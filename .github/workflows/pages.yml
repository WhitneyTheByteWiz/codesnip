name: Deploy web UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build deps
        run: npm ci

      - name: Build web assets
        run: npx tsc

      - name: Deploy to GitHub Pages (gh-pages branch)
        env:
          ACTION_DEPLOYMENT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use peaceiris/actions-gh-pages-style direct push to gh-pages
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the gh-pages branch (or create it)
          git clone --depth 1 --no-checkout https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git gh-pages-tmp
          cd gh-pages-tmp
          git config commit.gpgsign false
          git checkout --orphan gh-pages 2>/dev/null || git checkout -b gh-pages
          git rm -rf --cached . 2>/dev/null || true

          # Copy built output
          rm -rf *
          cp -r ../public/* .
          echo "whitneythebytewiz.github.io" > CNAME

          git add -A
          git commit -m "Deploy web UI from ${{ github.sha }}" || echo "No changes to deploy"
          git push -u origin gh-pages --force

          cd ..
          rm -rf gh-pages-tmp

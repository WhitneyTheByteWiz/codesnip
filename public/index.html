<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeSnip — find reusable code</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --green:#3fb950; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; min-height:100vh; padding:3rem 1rem; }
  main { max-width:820px; margin:0 auto; }
  h1 { font-size:1.8rem; letter-spacing:-.5px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); margin:.4rem 0 2rem; }
  form { display:flex; gap:.5rem; margin-bottom:1.5rem; }
  input { flex:1; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:.8rem 1rem; color:var(--text); font:inherit; }
  input:focus { outline:2px solid var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:.8rem 1.6rem; font:inherit; font-weight:700; cursor:pointer; }
  button:hover { filter:brightness(1.15); }
  .result { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1.1rem 1.3rem; margin-bottom:1rem; }
  .result h3 { font-size:1rem; display:flex; justify-content:space-between; gap:1rem; }
  .stars { color:#e3b341; white-space:nowrap; }
  .desc { color:var(--muted); font-size:.85rem; margin:.3rem 0 .6rem; }
  a { color:var(--accent); text-decoration:none; font-size:.85rem; }
  a:hover { text-decoration:underline; }
  .meta { color:var(--muted); font-size:.75rem; }
  .empty { color:var(--muted); text-align:center; padding:3rem 0; }
</style>
</head>
<body>
<main>
  <h1>&gt;_ Code<span>Snip</span></h1>
  <p class="sub">Search battle-tested code from real projects. __COUNT__ snippets indexed. Find similar work, adapt it, ship faster.</p>
  <form id="f">
    <input id="q" placeholder='e.g. "rate limiter", "jwt auth", "retry with backoff"…' autofocus>
    <button>Search</button>
  </form>
  <div id="out"><p class="empty">Type a query — results come from your local index.<br>Build one first: <code>codesnip index -k "cli tools"</code></p></div>
</main>
<script>
const out = document.getElementById('out');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById('q').value;
  const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
  const { snippets, queryTimeMs } = await r.json();
  if (!snippets.length) { out.innerHTML = `<p class="empty">No results for "${esc(q)}" (${queryTimeMs}ms)</p>`; return; }
  out.innerHTML = snippets.map(s => `
    <div class="result">
      <h3>${esc(s.title)} <span class="stars">★ ${s.quality.stars.toLocaleString()}</span></h3>
      <p class="desc">${esc(s.description)}</p>
      <a href="${esc(s.source.url)}" target="_blank" rel="noopener">${esc(s.source.repository ?? s.source.url)}</a>
      <span class="meta"> · ${esc(s.language)} · score ${s.quality.score}</span>
    </div>`).join('');
};
</script>
</body>
</html>
